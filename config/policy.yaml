global:
  dry_run: true            # No actual changes made when true
  region: us-east-1        # Default AWS region
  log_level: INFO          # DEBUG, INFO, WARNING, ERROR
  scan_all: true           # Scan all enabled services

services:
  s3:
    enabled: true
    # Optional: Target bucket for S3 server access logs when enabling logging
    # Leave empty to skip auto-enabling logging
    s3_log_bucket: ""
    checks:
      - public_access
      - encryption_enabled
      - versioning_enabled
      - logging_enabled
      - block_public_policy
      - access_logging

  iam:
    enabled: true
    checks:
      - inline_policies
      - overly_permissive_policies
      - password_policy
      - mfa_enabled
      - unused_access_keys
      - root_account_usage

  ec2:
    enabled: true
    # Optional: KMS Key ID or ARN to use when encrypting unencrypted EBS volumes via modify_volume
    kms_key_id: ""
    checks:
      - unrestricted_ssh
      - insecure_security_groups
      - metadata_http_token
      - public_ip_assignment
      - volume_encryption

  rds:
    enabled: true
  # Backup retention days to enforce when below this threshold
  backup_retention_days: 7
    checks:
      - public_access
      - storage_encryption
      - backup_retention
      - deletion_protection

  cloudtrail:
    enabled: true
    checks:
      - logging_enabled
      - multi_region_trail
      - log_file_validation

  cloudwatch:
    enabled: true
    checks:
      - alarm_on_root_login
      - alarm_on_suspicious_api_calls
      - alarm_on_unauthorized_api_calls

  lambda:
    enabled: true
    # Optional: KMS Key ARN to encrypt environment variables; when empty, remediation is skipped
    kms_key_arn: ""
    # Control X-Ray tracing remediation
    tracing_enabled: true
    checks:
      - function_timeout
      - logging_enabled
      - over_permissioned_role
      - environment_variable_encryption

  ebs:
    enabled: true
    checks:
      - volume_encryption
      - snapshot_public_access
      - unused_volumes

  elb:
    enabled: true
    checks:
      - deletion_protection
      - idle_timeout
      - ssl_policy
      - access_logging

  ssm:
    enabled: true
    checks:
      - document_permissions
      - session_logging
      - patch_compliance

  sns:
    enabled: true
  # Optional: KMS Key ARN to enable at-rest encryption; when empty, uses alias/aws/sns by default
  kms_key_arn: ""
    checks:
      - public_access
      - encryption
      - subscriptions_confirmation

  sqs:
    enabled: true
    checks:
      - server_side_encryption
      - public_access
      - dead_letter_queue_configured
